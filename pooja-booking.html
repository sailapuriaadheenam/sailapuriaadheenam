<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Pooja Booking | சைலாபுரி ஆதீன திருமடம்</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="main-nav">
            <div class="logo-area">
                <img src="images/56fa0e18-81f3-4be4-989b-5fe764f29316.jpeg" alt="Logo">
                <div class="logo-text">
                    <h1>சைலாபுரி ஆதீன திருமடம்</h1>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="pooja-booking.html" class="active">Pooja Booking</a></li>
                <li><a href="live-darshan.html">Live Darshan</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-header">
        <h1>Online Pooja Booking</h1>
        <p>Home > Pooja Booking</p>
    </section>

    <section class="container py-4">
        <div class="glass-card" style="max-width: 800px; margin: 0 auto;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 30px; border-bottom: 1px solid var(--gold-primary); padding-bottom: 20px;">
                <div class="text-center gold-text"><strong>1. Pooja Details</strong></div>
                <div class="text-center" style="color: var(--text-muted)">2. Payment</div>
                <div class="text-center" style="color: var(--text-muted)">3. Confirmation & Live Access</div>
            </div>

            <form id="bookingForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Select Pooja *</label>
                        <select id="poojaType" class="form-control" required>
                            <option value="special">ஆடிப் பதினெட்டாம் பெருக்கு சிறப்பு பூஜை</option>
                            <option value="daily">நித்தியப்படி பூஜை</option>
                            <option value="homam">மகா கணபதி ஹோமம்</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Your Name *</label>
                        <input type="text" id="bookingName" class="form-control" required placeholder="Enter your name">
                    </div>
                    
                    <div class="form-group">
                        <label>Mobile Number *</label>
                        <input type="tel" id="bookingMobile" class="form-control" required placeholder="Enter mobile number">
                    </div>

                    <div class="form-group">
                        <label>Nakshatra</label>
                        <select id="bookingNakshatra" class="form-control">
                            <option>Select Nakshatra</option>
                            <option>Ashwini</option>
                            <option>Bharani</option>
                            <option>Krittika</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Gothram</label>
                        <input type="text" id="bookingGothram" class="form-control" placeholder="Enter Gothram">
                    </div>

                    <div class="form-group" style="grid-column: span 2;">
                        <label>Pooja Amount (₹)</label>
                        <input type="number" id="amount" class="form-control" value="365" readonly style="font-size: 1.5rem; font-weight: bold; color: var(--gold-primary); text-align: center;">
                    </div>
                </div>

                <div class="text-center mt-2">
                    <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.2rem; padding: 15px;">Proceed to Payment</button>
                    <p style="margin-top: 15px; color: var(--text-muted); font-size: 0.9rem;">* Successfully booked poojas will grant you access to the Live Darshan stream.</p>
                </div>
            </form>
        </div>
    </section>

    <script src="js/supabase.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
